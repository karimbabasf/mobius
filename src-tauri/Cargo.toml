[package]
name = "mobi-board"
version = "0.1.0"
description = "Observe local AI coding agents in one live desktop view."
authors = ["Karim Baba"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "mobi_board_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
# Offline BPE tokenizer (o200k_base vocab embedded at compile time) for the
# Layer-2 context-window breakdown. Exact for Codex, close proxy for Claude.
tiktoken-rs = "0.12"
# Read-only access to Hermes's session store (~/.hermes/state.db). `bundled`
# compiles SQLite in, so there is no system-library dependency.
rusqlite = { version = "0.32", features = ["bundled"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["signal"] }
