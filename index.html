<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MOBI board</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <main class="shell">
      <header id="top" class="prompt" aria-label="MOBI board overview">
        <span class="prompt__line">
          <span class="prompt__sigil" aria-hidden="true">▸</span>
          <span class="prompt__cmd">mobi-board</span>
          <span class="prompt__flag">--watch live</span>
          <span class="prompt__caret" aria-hidden="true">█</span>
        </span>
        <span class="status-chip" aria-label="Collector status">
          <span class="status-dot" aria-hidden="true"></span>
          collector: live
        </span>
      </header>

      <section id="metrics" class="telemetry" aria-label="Agent summary"></section>

      <section id="empty-state" class="empty-panel" aria-label="No active sessions">
        <div class="panel-header">
          <span>sessions</span>
          <span class="panel-state">listening</span>
        </div>
        <div class="empty-copy" role="status">
          <h2>Waiting for agents.</h2>
          <p>
            Start Claude Code or Codex and it'll appear here the moment its
            process comes alive — with live tokens and a running activity log.
            When you close it, the strip clears itself.
          </p>
          <ul class="signal-list" aria-label="Watched sources">
            <li><span></span>Claude Code</li>
            <li><span></span>Codex</li>
            <li><span></span>Cursor</li>
          </ul>
        </div>
      </section>

      <section
        id="session-grid"
        class="session-list"
        aria-label="Active agent sessions"
        hidden
      ></section>
    </main>
  </body>
</html>
